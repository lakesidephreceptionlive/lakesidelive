<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lakeside Clip Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     LAKESIDE CLIP PLAYER
     ------------------------------------------------------------
     Plays a chosen SEGMENT of a YouTube video on loop, muted,
     full screen — the trim feature OptiSigns doesn't have.

     HOW TO USE
     Point an OptiSigns "Website" asset at this page and pass the
     clip in the URL:

       clip.html?v=VIDEO_ID&start=45&end=95

       v      YouTube video ID, or paste the whole watch/share URL
       start  seconds to start at        (default 0)
       end    seconds to stop and loop   (default: end of video)
       msg    optional caption strap along the bottom
       cc     1 to force YouTube captions on, 0 to leave off (default 1)

     EXAMPLE
       clip.html?v=dQw4w9WgXcQ&start=30&end=75&msg=Ask%20us%20about%20dental%20x-rays

     NOTES
     - Autoplay only works muted. That is a browser rule, not a
       setting — but muted is what you wanted anyway.
     - The segment loops forever, so set the OptiSigns asset
       duration to however long you want it on screen.
     ============================================================ */
  :root{
    --maroon:#591913; --brick:#B72934; --cream:#F4ECE0; --honey:#C6852E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow:hidden;background:#000;
    font-family:"Figtree",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}

  /* The player is sized to cover the screen. YouTube always renders
     16:9 inside its iframe, so on a 16:9 TV this fills exactly. */
  #stage{position:fixed;inset:0;background:#000}
  #player{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:100vw;height:56.25vw;min-height:100vh;min-width:177.78vh;border:0}

  /* Caption strap. Because the sound is off, this is what carries
     the message — keep it short enough to read at a glance. */
  #msg{position:fixed;left:0;right:0;bottom:0;z-index:5;
    padding:calc(1.6vh + 0.6vw) 4vw calc(2vh + 0.6vw);
    background:linear-gradient(to top,rgba(0,0,0,.86) 0%,rgba(0,0,0,.68) 55%,rgba(0,0,0,0) 100%);
    color:#fff;font-size:calc(1.1vw + 1.1vh);font-weight:600;line-height:1.3;
    text-align:center;letter-spacing:.005em;text-shadow:0 2px 10px rgba(0,0,0,.6);
    transition:opacity .22s ease}
  #msg b{color:var(--honey)}
  #msg:empty{display:none}

  /* Small persistent brand mark so the screen still reads as yours
     while a video is playing. */
  #mark{position:fixed;top:2.4vh;left:2.2vw;z-index:5;
    font-size:calc(.6vw + .6vh);font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;color:rgba(255,255,255,.72);
    text-shadow:0 2px 8px rgba(0,0,0,.7)}

  /* Shown only when something is wrong — a bad ID, an embed the
     owner disabled, or no network. Never leaves a black screen
     with no explanation. */
  #err{position:fixed;inset:0;z-index:9;display:none;
    align-items:center;justify-content:center;text-align:center;
    background:var(--maroon);color:var(--cream);padding:6vw}
  #err.on{display:flex}
  #err div{max-width:34ch}
  #err h1{font-size:calc(1.4vw + 1.4vh);margin-bottom:1.2vh;color:#fff}
  #err p{font-size:calc(.8vw + .8vh);opacity:.8;line-height:1.5}
</style>
</head>
<body>
  <div id="stage"><div id="player"></div></div>
  <div id="mark">Lakeside Pet Hospital</div>
  <div id="msg"></div>
  <div id="err"><div>
    <h1>Clip unavailable</h1>
    <p id="errWhy">Check the video ID in the URL, and that the video allows embedding.</p>
  </div></div>

<script>
/* ---------- read the clip settings out of the URL ---------- */
const Q = new URLSearchParams(location.search);

/* Accept either a bare ID or a pasted YouTube link of any shape. */
function videoId(raw){
  if(!raw) return "";
  raw = raw.trim();
  if(/^[\w-]{11}$/.test(raw)) return raw;              // already an ID
  const m = raw.match(/(?:v=|youtu\.be\/|\/embed\/|\/shorts\/)([\w-]{11})/);
  return m ? m[1] : "";
}

const VIDEO = videoId(Q.get("v") || Q.get("id") || "");
const START = Math.max(0, parseFloat(Q.get("start") || "0") || 0);
const ENDQ  = parseFloat(Q.get("end") || "");
const END   = isFinite(ENDQ) && ENDQ > START ? ENDQ : null;   // null = play to the end
const MSG   = Q.get("msg") || "";
const CC    = Q.get("cc") === "0" ? 0 : 1;

/* ---------- timed on-screen messages ----------
   A muted lobby screen doesn't want a transcript — it wants a few
   deliberate lines that appear at the right moment. Those live in
   clips.json next to this file:

     {
       "VIDEO_ID": {
         "note": "Dental x-ray explainer",
         "cues": [
           { "t": 0,  "text": "Most of a tooth sits below the gumline" },
           { "t": 14, "text": "This is what an x-ray reveals" },
           { "t": 32, "text": "Ask us about our dental special" }
         ]
       }
     }

   t is seconds into the video. Each line stays up until the next
   one. A ?msg= in the URL overrides cues with a single fixed line. */
let CUES = [];
let cueIndex = -1;

async function loadCues(){
  if(MSG) return;                       // explicit single message wins
  try{
    const res = await fetch("clips.json?_=" + Date.now(), { cache: "no-store" });
    if(!res.ok) return;
    const all = await res.json();
    const entry = all[VIDEO];
    if(entry && Array.isArray(entry.cues)){
      CUES = entry.cues
        .filter(c => typeof c.t === "number" && c.text)
        .sort((a,b) => a.t - b.t);
    }
  }catch(e){
    console.warn("clips.json not loaded:", e.message);
  }
}

function updateCue(t){
  if(!CUES.length) return;
  let i = -1;
  for(let k = 0; k < CUES.length; k++){ if(t >= CUES[k].t) i = k; else break; }
  if(i === cueIndex) return;
  cueIndex = i;
  const el = document.getElementById("msg");
  el.style.opacity = 0;
  setTimeout(() => {
    el.textContent = i >= 0 ? CUES[i].text : "";
    el.style.opacity = 1;
  }, 220);
}

document.getElementById("msg").textContent = MSG;

function fail(why){
  document.getElementById("errWhy").textContent = why;
  document.getElementById("err").classList.add("on");
}

if(!VIDEO){
  fail("No video specified. Add ?v=VIDEO_ID to the address, for example ?v=abc123XYZ89&start=30&end=90");
}

/* ---------- load YouTube's player API ---------- */
let player = null, watchdog = null;

if(VIDEO){
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.onerror = () => fail("Could not reach YouTube. Check the screen's internet connection.");
  document.head.appendChild(s);
}

function onYouTubeIframeAPIReady(){
  player = new YT.Player("player", {
    videoId: VIDEO,
    playerVars: {
      autoplay: 1,
      mute: 1,               // required for autoplay; also what we want on a lobby screen
      controls: 0,
      disablekb: 1,
      fs: 0,
      rel: 0,                // limits end-screen suggestions to the same channel
      playsinline: 1,
      cc_load_policy: CC,    // ask YouTube to show captions
      cc_lang_pref: "en",
      iv_load_policy: 3,     // hide annotations
      start: Math.floor(START),
      end: END ? Math.ceil(END) : undefined
    },
    events: { onReady, onStateChange, onError }
  });
}
window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

function onReady(e){
  e.target.mute();                 // belt and braces — some TV browsers ignore the param
  e.target.seekTo(START, true);
  e.target.playVideo();
  loadCues().then(startWatchdog);
}

/* The player's own `end` parameter stops playback but doesn't loop a
   segment, so we watch the clock and jump back ourselves. The same
   tick drives the timed messages. 250ms is frequent enough to be
   invisible and light enough for a TV stick. */
function startWatchdog(){
  clearInterval(watchdog);
  watchdog = setInterval(() => {
    if(!player || !player.getCurrentTime) return;
    const t = player.getCurrentTime();
    updateCue(t);
    if(END !== null && t >= END - 0.15){
      cueIndex = -1;               // let the cue sequence restart with the clip
      player.seekTo(START, true);
      player.playVideo();
    }
  }, 250);
}

function onStateChange(e){
  // Reaching the true end of the video, or any unexpected stop,
  // sends us back to the start of the segment.
  if(e.data === YT.PlayerState.ENDED){
    player.seekTo(START, true);
    player.playVideo();
  }
  if(e.data === YT.PlayerState.PAUSED){
    // Nothing should ever pause this screen. If something does, resume.
    setTimeout(() => { try { player.playVideo(); } catch(_){} }, 400);
  }
}

function onError(e){
  const why = {
    2:   "That video ID doesn't look valid. Check the ?v= value in the address.",
    5:   "This video can't play in this browser. Try a different clip.",
    100: "That video is private or has been removed.",
    101: "The owner of this video doesn't allow it to be embedded on other sites.",
    150: "The owner of this video doesn't allow it to be embedded on other sites."
  }[e.data] || "The video could not be played.";
  fail(why);
}

/* If the TV sleeps and wakes, or OptiSigns backgrounds the page,
   pick up where we should be rather than sitting frozen. */
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && player && player.playVideo){
    try { player.playVideo(); } catch(_){}
  }
});
</script>
</body>
</html>
